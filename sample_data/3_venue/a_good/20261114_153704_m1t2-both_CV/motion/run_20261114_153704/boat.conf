# Boat broker, POOL profile - mosquitto on the Orin NX. Rendered by scripts/run_usv.sh (198.18.0.13 -> the Mac's IP,
# or the whole bridge block dropped when OCS_HOST is unset: usv_ui + mission manager + AGX work without the hub).
listener 1884 0.0.0.0
protocol mqtt
listener 9002 0.0.0.0
protocol websockets
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true
persistence true
persistence_location /tmp/optiprimex_boat/
max_queued_messages 10000
sys_interval 2
log_type error
log_type warning
log_type notice

# ---- bridge to the OCS hub on the Mac (ARCHITECTURE 5.2 lines, decision 26: UAV traffic rides this link as relay/usv) ----
connection ocs
address 198.18.0.13:1882
cleansession false
notifications true
notification_topic $SYS/broker/connection/ocs/state
restart_timeout 1 5
keepalive_interval 5
try_private true
bridge_protocol_version mqttv311
topic team/optiprime/v1/status/usv/# out 0
topic team/optiprime/v1/telemetry/usv/# out 0
topic host/+ out 0 local/usv/ team/optiprime/v1/telemetry/usv/
topic team/optiprime/v1/ack/usv/# out 1
topic team/optiprime/v1/event/usv/# out 1
topic team/optiprime/v1/cmd/usv/# in 1
topic ocs/state in 0
topic team/optiprime/v1/event/uav/# in 1
topic status/uav out 0 team/optiprime/v1/ team/optiprime/v1/relay/usv/
topic event/uav/# out 1 team/optiprime/v1/ team/optiprime/v1/relay/usv/
topic ack/uav/# out 1 team/optiprime/v1/ team/optiprime/v1/relay/usv/
topic team/optiprime/v1/cmd/uav/# in 1
topic perception/# in 0 local/usv/uav/ uav/

# v0.1.66 (WP16, D21): the DIRECT path - a second bridge to the mosquitto on the UAV Orin (UAV_BROKER_HOST:UAV_BROKER_PORT, network*.env);
# rendered by run_usv.sh only with UAV_BROKER_HOST set and UAV_BUOY_PATH direct (else dropped); the same boat topic as the relay
