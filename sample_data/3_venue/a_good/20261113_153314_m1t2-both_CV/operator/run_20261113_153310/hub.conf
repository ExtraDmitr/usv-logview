# OCS hub, POOL profile - mosquitto on the Mac: the boat broker bridges in over the pool Wi-Fi/LAN, map.html and the
# bench TUI use websockets 9001. Rendered by scripts/run_ocs.sh (/tmp/optiprimex_hub). Anonymous: the course profile adds ACLs.
listener 1882 0.0.0.0
protocol mqtt
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
persistence true
persistence_location /tmp/optiprimex_hub/
max_queued_messages 10000
sys_interval 2
log_type error
log_type warning
log_type notice
